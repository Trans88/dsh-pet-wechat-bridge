name: Little Pet tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node dependency-check.mjs
      - run: npm test
      - name: Install Chromium for media and layout checks
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - name: Check decoded video, audio and responsive controls
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: node --test test/exploration-browser.test.mjs
        env:
          PET_BROWSER_TEST: '1'
